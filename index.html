<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .ui .pointer {
        width: 5px;
        height: 5px;
        border-radius: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -2.5px;
        margin-top: -2.5px;
        background: #fff;
        z-index: 9999;
      }
      .ui .pointer.active {
        background: transparent;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        border: 1px solid #fff;
      }
      .ui .pointer-text {
        width: 200px;
        border-radius: 0;
        position: absolute;
        left: 51%;
        top: 50%;
        margin-top: -18px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: center;
        color: #fff;
        padding: 5px;
        z-index: 9999;
        display: none;
        font-size: 14px;
        text-shadow: 1px 1px #333;
      }
      #NotiflixNotifyWrap {
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-shadow: 1px 1px #333;
      }
      .key {
        border: 1px solid currentColor;
        border-radius: 3px;
        font-size: 12px;
        padding: 1px 3px;
        font-family: monospace;
      }
      .ui .infobox {
        width: 300px;
        border-radius: 0;
        position: absolute;
        left: 10px;
        top: 10px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: left;
        color: #fff;
        padding: 5px 10px;
        z-index: 9999;
        font-size: 12px;
        text-shadow: 1px 1px #333;
        text-align: center;
      }
      .ui .infobox-header {
        float: left;
        text-align: left;
      }
      .ui .infobox-level {
        display: inline-block;
      }
      .ui .infobox-timer {
        float: right;
        text-align: right;
      }
      .ui .infobox-description {
        float: left;
        text-align: left;
      }
      .ui .speed {
        width: 100px;
        border-radius: 0;
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: center;
        color: #fff;
        padding: 5px;
        z-index: 9999;
        font-size: 16px;
        text-shadow: 1px 1px #333;
      }
      .ui .speed #value {
        font-size: 28px;
      }
      .swal-modal {
        background: #fff;
        border-radius: 0;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        animation: none;
      }
      .swal-title {
        color: #333;
      }
      .swal-text {
        color: #333;
      }
      .swal-button {
        color: #fff;
        background: #333;
        border-radius: 0;
        width: 120px;
        font-size: 12px;
        padding: 8px 1px;
        box-shadow: none !important;
      }
      .swal-button:hover {
        background: #aaa !important;
      }
      .swal-button:active {
        background: #777 !important;
      }
      .swal-footer {
        text-align: center;
        padding: 10px 16px;
      }
      .swal-button[disabled] {
        cursor: not-allowed;
        background: #333 !important;
      }
    </style>
  </head>
  <body>
    <script src="/js/three.js"></script>
    <script src="/js/GLTFLoader.js"></script>
    <script src="/js/PointerLockControls.js"></script>
    <script src="/js/Tween.js"></script>
    <script src="/js/physics.js"></script>
    <script src="/js/text.js"></script>
    <script src="/js/notiflix.js"></script>
    <script src="/js/sweetalert.js"></script>
    <div class="ui">
      <div class="pointer"></div>
      <div class="pointer-text">Pointer text.</div>
      <div class="infobox">
        <p class="infobox-header">Objective</p>
        <p class="infobox-level">Level 1 / 15</p>
        <p class="infobox-timer">0:00</p>
        <br>
        <p class="infobox-description">Park in the outlined spot before the time runs out. Once you're confident, shift into park to finish. Careful not to crash!</p>
      </div>
      <div class="speed"><span id="value">0</span> MPH</div>
    </div>
  <script>
    Notiflix.Notify.init({
      clickToClose: false,
      showOnlyTheLastOne: true,
      timeout: 2000,
      info: {
        background: "transparent",
        textColor: "#fff",
        notiflixIconColor: "#fff"
      },
      warning: {
        background: "transparent",
        textColor: "#fff",
        notiflixIconColor: "gold"
      }
    });

    function pointerText(text) {
      document.querySelector(".pointer-text").innerHTML = text;
      document.querySelector(".pointer-text").style.display = "block";
    }

    function hidePointerText() {
      document.querySelector(".pointer-text").style.display = "";
    }

    function exitControlLock() {
      controlLock = null;
      PointerControls.isLocked = true;
      hidePointerText();
    }

    let car = null;
    let ground = null;
    let carColliders = [];
    let perspective = 0;
    let steeringLeft = false;
    let steeringRight = false;
    let throttle = false;
    let braking = false;
    let intersections = null;
    let frame = 0;
    let controlLock = null;
    let manualSteering = false;
    let stopAnimate = false;
    let resetCarPosition = null;
    let currentGear = "drive";
    options = {
      carHeadingMaxIncrement: 0.5,
      carHeadingIncrement: 0
    };
    controls = {
      "Control_Screen": true,
      "Horn": true,
      "Ignition": true,
      "Lever": true,
      "Lever_Alt": false,
      "Shifter": true
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, { format: THREE.RGBAFormat });
    const cubeCamera = new THREE.CubeCamera(0.1, 1000, cubeRenderTarget);
    scene.add(cubeCamera);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x2b2c2d, 0.5);
    const interiorLight = new THREE.PointLight(0xffffff, 0.5);
    directionalLight.castShadow = true;
    directionalLight.shadow.camera.left = -5;
    directionalLight.shadow.camera.right = 5;
    directionalLight.shadow.camera.top = 5;
    directionalLight.shadow.camera.bottom = -5;
    directionalLight.shadow.camera.near = 1;
    directionalLight.shadow.camera.far = 100;
    directionalLight.shadow.bias = -0.001;
    directionalLight.shadow.mapSize.width = 1024;
    directionalLight.shadow.mapSize.height = 1024;
    directionalLight.shadow.camera.updateProjectionMatrix();
    directionalLight.target.position.set(0, 0, 0);
    scene.add(directionalLight);
    scene.add(directionalLight.target);
    scene.add(ambientLight);
    scene.add(hemisphereLight);
    scene.add(interiorLight);

    scene.background = new THREE.Color(0xaaaaaa);
    scene.fog = new THREE.Fog(0xaaaaaa, 0,  200);

    const PointerControls = new PointerLockControls(camera, renderer.domElement);
    pointerSpeed = 2;
    PointerControls.isLocked = true;
    PointerControls.pointerSpeed = pointerSpeed;

    const centerVector = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    raycastTargets = [];

    document.body.appendChild(renderer.domElement);

    function gameOver(reason) {
      stopAnimate = true;
      swal({
        title: "Game over",
        text: "You exited the parking lot.",
        buttons: ["Retry (10 PTS)", "Return to menu"],
        closeOnEnterKey: false,
        closeOnEsc: false,
        closeOnClickOutside: false
      }).then(result => {
        if (!result) {
          physics.env.enginePower = 0;
          physics.env.speedMS = 0;
          physics.env.heading = 0;
          resetCarPosition();
          togglePerspective(0);
          perspective = 0;
          camera.rotation.set(0, 0, 0);

          stopAnimate = false;
          animate();

          swal.close();
        }
      });
      document.querySelector(".swal-button").style.border = "2px solid gold";
      document.querySelector(".swal-button").disabled = "disabled";

      if (reason === "outofbounds") {
        document.querySelector(".swal-text").textContent = "You exited the parking lot.";
      } else if (reason === "time") {
        document.querySelector(".swal-text").textContent = "You ran out of time.";
      } else if (reason === "crashed") {
        document.querySelector(".swal-text").textContent = "You crashed!";
      }
    }

    function togglePerspective(newPerspective = null) {
      if (newPerspective == null) newPerspective = perspective + 1;
      if (newPerspective > 2) newPerspective = 0;

      exitControlLock();
      if (newPerspective === 1) {
        perspective = 1;
        car.getObjectByName("CameraHolder_TP").add(camera);
        camera.rotation.set(0, 0, 0);
        PointerControls.isLocked = false;
        document.querySelector(".pointer").style.display = "none";
      } else if (newPerspective === 2) {
        perspective = 2;
        car.getObjectByName("CameraHolder_TP1").add(camera);
        camera.rotation.set(0, 0, 0);
        PointerControls.isLocked = false;
        document.querySelector(".pointer").style.display = "none";
      } else if (newPerspective === 0) {
        perspective = 0;
        car.getObjectByName("CameraHolder_FP").add(camera);
        PointerControls.isLocked = true;
        document.querySelector(".pointer").style.display = "";
      }
    }

    function animate() {
      if (stopAnimate) return;

      frame++;

      physics.update();
      THREE.Text.update();

      if (car) {
        directionalLight.position.set(car.position.x + 10, 10, car.position.z + 5);
        directionalLight.target.position.set(car.position.x, 0, car.position.z);
        directionalLight.target.updateMatrixWorld();

        car.visible = false;
        cubeCamera.position.copy(car.position);
        cubeCamera.translateY(1);
        cubeCamera.update(renderer, scene);
        car.visible = true;

        interiorLight.position.copy(car.position);
        interiorLight.rotation.copy(car.rotation);
        interiorLight.translateY(1);
        interiorLight.translateX(0.5);

        if (throttle) {
          if (currentGear === "drive") {
            physics.env.enginePower = Math.min(physics.env.enginePower + 1500, physics.env.maxEnginePower);
          } else if (currentGear === "reverse") {
            physics.env.enginePower = Math.min(physics.env.enginePower + 1500, physics.env.maxEnginePowerReverse);
          }
        } else {
          physics.env.enginePower = 0;
        }

        if (braking) {
          physics.env.braking = true;
          physics.env.brakePower = Math.min(physics.env.brakePower + 500, physics.env.maxBrakePower);
        } else {
          physics.env.braking = false;
          physics.env.brakePower = 0;
        }

        if (frame % 15 === 0) {
          raycaster.setFromCamera(centerVector, camera);
          intersections = raycaster.intersectObjects(raycastTargets);
          for (let i = 0; i < raycastTargets.length; i++) {
            if (typeof raycastTargets[i].getObjectByName("PointerText") !== "undefined") raycastTargets[i].getObjectByName("PointerText").visible = false;
          }

          if (intersections[0]) {
            PointerControls.pointerSpeed = pointerSpeed / 3;
            document.querySelector(".pointer").classList.add("active");
            if (typeof intersections[0].object.getObjectByName("PointerText") !== "undefined" && !controlLock) intersections[0].object.getObjectByName("PointerText").visible = true;
          } else {
            document.querySelector(".pointer").classList.remove("active");
            PointerControls.pointerSpeed = pointerSpeed;
          }
        }

        if (currentGear === "drive") {
          car.getObjectByName("Shifter").rotation.x = -0.3;
        } else if (currentGear === "neutral") {
          car.getObjectByName("Shifter").rotation.x = -0.1;
        } else if (currentGear === "reverse") {
          car.getObjectByName("Shifter").rotation.x = 0.1;
        } else if (currentGear === "park") {
          car.getObjectByName("Shifter").rotation.x = 0.3;
        }

        if (ground && carColliders.length > 0) {
          ground.traverse(wallPoint => {
            for (let i = 0; i < carColliders.length; i++) {
            let collider = carColliders[i];
          
            if (wallPoint.name.startsWith("WallPoint")){
              if (collider.name.startsWith("Collider")){
                  if (collider.getWorldPosition(new THREE.Vector3()).distanceTo(wallPoint.getWorldPosition(new THREE.Vector3())) < 0.4) gameOver("outofbounds");
                }
              }
            }
          });
        }
      }
      physics.env.heading = Math.max(Math.min(physics.env.heading + options.carHeadingIncrement, 35), -35);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    function onWindowResize() {
      renderer.setPixelRatio(1);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
    }
    window.addEventListener("resize", onWindowResize);
    onWindowResize();

    physics.onUpdate = function(delta) {
      if (car) {
        const shiftFactor = physics.env.currentGear === "drive" ? 1 : -1;
        car.translateZ(physics.env.speedMS * delta * shiftFactor);
        car.rotateY(physics.env.currentHeading * delta * shiftFactor);

        if (!manualSteering) {
          physics.env.heading = physics.env.heading - ((physics.env.heading / 25) * (physics.env.speedMS / 10));
        }

        car.getObjectByName("Wheel_FL").rotation.y = THREE.MathUtils.degToRad(physics.env.heading);
        car.getObjectByName("Wheel_FR").rotation.y = THREE.MathUtils.degToRad(physics.env.heading);
        car.getObjectByName("Steering_Wheel").rotation.z = -THREE.MathUtils.degToRad(physics.env.heading) * physics.env.wheelTurnRatio;

        car.getObjectByName("Wheel_FL").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_FR").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_RL").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_RR").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        document.querySelector(".speed #value").textContent = Math.round(physics.env.speedMPH);
      }
    };

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowUp" && !event.repeat) {
        if (controlLock === "Shifter") {
          if (currentGear === "drive") {
            currentGear = "neutral";
            Notiflix.Notify.info("Car is now in neutral.");
          } else if (currentGear === "neutral") {
            currentGear = "reverse";
            physics.env.currentGear = "reverse";
            Notiflix.Notify.info("Car is now in reverse.");
          } else if (currentGear === "reverse") {
            currentGear = "park";
          }
          if (currentGear === "reverse") {
            car.getObjectByName("Reverse_Lights").material.emissive = new THREE.Color(0xffffff);
            car.getObjectByName("Reverse_Lights").material.opacity = 1;
          } else {
            car.getObjectByName("Reverse_Lights").material.opacity = 0;
          }
        } else {
          throttle = true;
        }
      }
      if (event.key === "ArrowDown" && !event.repeat) {
        if (controlLock === "Shifter") {
          if (currentGear === "park") {
            currentGear = "reverse";
            physics.env.currentGear = "reverse";
            Notiflix.Notify.info("Car is now in reverse.");
          } else if (currentGear === "reverse") {
            currentGear = "neutral";
            Notiflix.Notify.info("Car is now in neutral.");
          } else if (currentGear === "neutral") {
            currentGear = "drive";
            physics.env.currentGear = "drive";
            Notiflix.Notify.info("Car is now in drive.");
          }
          if (currentGear === "reverse") {
            car.getObjectByName("Reverse_Lights").material.emissive = new THREE.Color(0xffffff);
            car.getObjectByName("Reverse_Lights").material.opacity = 1;
          } else {
            car.getObjectByName("Reverse_Lights").material.opacity = 0;
          }
        }
      }
      if (event.key === "ArrowLeft") {
        manualSteering = true;
        new Tween(options.carHeadingIncrement, options.carHeadingMaxIncrement, 250, "in", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "ArrowRight") {
        manualSteering = true;
        new Tween(options.carHeadingIncrement, -options.carHeadingMaxIncrement, 250, "in", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "Tab" && !event.repeat) {
        event.preventDefault();
        togglePerspective();
      }
      if (event.key === "b" && !event.repeat) {
        braking = true;
        car.getObjectByName("Brake_Lights").material.emissive = new THREE.Color(0xff0000);
      }
      if (event.key === "Escape" && controlLock && !event.repeat) {
        exitControlLock();
      }
    });

    document.addEventListener("keyup", function(event) {
      if (event.key === "ArrowUp") {
        throttle = false;
      }
      if (event.key === "ArrowLeft") {
        manualSteering = false;
        new Tween(options.carHeadingIncrement, 0, 500, "out", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "ArrowRight") {
        manualSteering = false;
        new Tween(options.carHeadingIncrement, 0, 500, "out", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "b") {
        braking = false;
        car.getObjectByName("Brake_Lights").material.emissive = new THREE.Color(0x000000);
      }
    });

    document.addEventListener("mousedown", function(event) {
      if (intersections[0]) {
        const control = intersections[0].object.name;
        if (!controlLock) {
          if (control === "Shifter") {
            if (physics.env.speedMS > 0.2) return Notiflix.Notify.warning("The car must be fully stopped in order to shift gears.");
            pointerText("You are now shifting gears (<span class='key'>&UpArrow;</span> <span class='key'>&DownArrow;</span> to shift, <span class='key'>Esc</span> to exit)");
            controlLock = "Shifter";
            PointerControls.isLocked = false;
          }
        }
      }
    });

    function loadVehicle() {
      new THREE.GLTFLoader().load("/models/cars/Honda_Civic_Sport_Touring.glb", function(gltf) {
        car = gltf.scene;

        const enginePhysicsKeys = ["finalDrive", "wheelRadius", "maxRPM", "maxRPMReverse"];
        Object.keys(car.children[0].userData).forEach((key, index) => {
          if (enginePhysicsKeys.includes(key)) {
            physics.env.engine[key] = Object.values(car.children[0].userData)[index];
          } else {
            physics.env[key] = Object.values(car.children[0].userData)[index];
          }
        });

        car.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) child.material.vertexColors = false;
          }
        });

        car.getObjectByName("CameraHolder_FP").add(camera);
        car.getObjectByName("Wheel_FL").rotation.order = "YXZ";
        car.getObjectByName("Wheel_FR").rotation.order = "YXZ";
        car.getObjectByName("Wheel_RL").rotation.order = "YXZ";
        car.getObjectByName("Wheel_RR").rotation.order = "YXZ";

        new THREE.TextureLoader().load("/sky.png", function(texture) {
          let pmremGenerator = new THREE.PMREMGenerator(renderer);
          let envMap = pmremGenerator.fromEquirectangular(texture).texture;
          car.getObjectByName("Exterior_Shell").material.envMap = envMap;
        });

        new THREE.GLTFLoader().load("/models/parking_lots/lvl1.glb", function(gltf) {
          ground = gltf.scene;

          let scale = 0.33;
          let spawner = ground.getObjectByName("Spawner");
          ground.scale.set(scale, scale, scale);

          resetCarPosition = function() {
            car.position.set(spawner.position.x * scale, spawner.position.y * scale, spawner.position.z * scale);
            car.rotation.copy(ground.getObjectByName("Spawner").rotation);
          };
          resetCarPosition();

          ground.getObjectByName("Ground").receiveShadow = true;
          ground.getObjectByName("Ground").material.map.encoding = THREE.sRGBEncoding;
          ground.getObjectByName("Ground").material.map.minFilter = THREE.NearestFilter;
          ground.getObjectByName("Ground").material.map.magFilter = THREE.NearestFilter;
          ground.getObjectByName("Ground").material.map.needsUpdate = true;

          scene.add(ground);
        });

        car.getObjectByName("Mirrors").material.envMap = cubeRenderTarget.texture;

        raycastTargets = [car.getObjectByName("Horn"), car.getObjectByName("Ignition"), car.getObjectByName("Lever"), car.getObjectByName("Lever_Alt"), car.getObjectByName("Shifter"), car.getObjectByName("Control_Screen")];
        raycastTargets.forEach((control, index) => {
          if (!controls[control.name]) return raycastTargets.splice(index, 1);
        });
        raycastTargets.forEach((control, index) => {
          if (control.name === "Control_Screen") {
            return;
          }

          let nameMap = {
            "Horn": "Car horn",
            "Ignition": "Car ignition",
            "Lever": "Control stick",
            "Lever_Alt": "Control stick",
            "Shifter": "Shifter"
          };
          const pointer = THREE.Text.createPointerText(nameMap[control.name], 30, "Arial");
          control.add(pointer);
        });

        carColliders = [car.getObjectByName("Collider_FL"), car.getObjectByName("Collider_FM"), car.getObjectByName("Collider_FR"), car.getObjectByName("Collider_RL"), car.getObjectByName("Collider_RM"), car.getObjectByName("Collider_RR")];

        scene.add(car);
      });
    }

    loadVehicle();
  </script>
  </body>
</html>
