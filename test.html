<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Parking Master Driving Test</title>
    <style>
      @keyframes implode {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(0.5);
        }
      }
      @keyframes explode {
        0% {
          transform: scale(0.5);
        }
        80% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none !important;
        user-select: none !important;
        -webkit-user-select: none !important;
        -khtml-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .ui .pointer {
        width: 5px;
        height: 5px;
        border-radius: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -2.5px;
        margin-top: -2.5px;
        background: #fff;
        z-index: 9999;
      }
      .ui .pointer.active {
        background: transparent;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        border: 1px solid #fff;
      }
      .ui .pointer-text {
        width: 200px;
        border-radius: 0;
        position: absolute;
        left: 51%;
        top: 50%;
        margin-top: -18px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: center;
        color: #fff;
        padding: 5px;
        z-index: 9999;
        display: none;
        font-size: 14px;
        text-shadow: 1px 1px #333;
      }
      #NotiflixNotifyWrap {
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-shadow: 1px 1px #333;
      }
      .key {
        border: 1px solid currentColor;
        border-radius: 3px;
        font-size: 12px;
        padding: 1px 3px;
        font-family: monospace;
      }
      .ui .infobox {
        width: 300px;
        border-radius: 0;
        position: absolute;
        left: 10px;
        top: 10px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: left;
        color: #fff;
        padding: 5px 10px;
        z-index: 9999;
        font-size: 12px;
        text-shadow: 1px 1px #333;
        text-align: center;
        pointer-events: none;
      }
      .ui .infobox-header {
        float: left;
        text-align: left;
      }
      .ui .infobox-level {
        display: inline-block;
      }
      .ui .infobox-timer {
        float: right;
        text-align: right;
      }
      .ui .infobox-description {
        float: left;
        text-align: left;
      }
      .ui .speed {
        width: 100px;
        border-radius: 0;
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: center;
        color: #fff;
        padding: 5px;
        z-index: 9999;
        font-size: 16px;
        text-shadow: 1px 1px #333;
        pointer-events: none;
      }
      .ui .speed #value {
        font-size: 28px;
      }
      .ui .settings {
        position: absolute;
        left: 0;
        bottom: 0;
        color: #333;
        font-size: 28px;
        padding: 5px;
        background: #fff;
        border-radius: 6px;
        bottom: 10px;
        left: 130px;
        z-index: 9999;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        border: .5px solid #999;
      }
      .ui .points {
        width: 100px;
        border-radius: 0;
        position: absolute;
        right: 10px;
        bottom: 10px;
        background: transparent;
        backdrop-filter: blur(5px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
        text-align: center;
        color: #fff;
        padding: 5px;
        z-index: 9999;
        font-size: 16px;
        text-shadow: 1px 1px #333;
        pointer-events: none;
      }
      .ui .points #value {
        font-size: 28px;
      }
      .swal-modal {
        background: #fff;
        border-radius: 0;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
      }
      .swal-title {
        color: #333;
      }
      .swal-text {
        color: #333;
      }
      .swal-button {
        color: #fff;
        background: #333;
        border-radius: 0;
        width: 120px;
        font-size: 12px;
        padding: 8px 1px;
        box-shadow: none !important;
      }
      .swal-button:hover {
        background: #aaa !important;
      }
      .swal-button:active {
        background: #777 !important;
      }
      .swal-footer {
        text-align: center;
        padding: 10px 16px;
      }
      .swal-button[disabled] {
        cursor: not-allowed;
        background: #333 !important;
      }
      .swal-icon img {
        width: 100px;
      }
      .banner {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: 0;
        background-color: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 10000;
        transition: opacity 1s;
      }
      .banner.loading {
        background-image: url(/images/loading.gif);
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #fff !important;
      }
      .start-banner {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        margin: 0;
        background-color: #fff;
        opacity: 1;
        pointer-events: none;
        transition: opacity 1s;
        background-image: url(/images/test.png);
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 10001;
      }
      .ui .pause-menu {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        margin: 0;
        z-index: 10000;
        color: #fff;
        display: none;
      }
      .ui .pause-menu .header {
        font-size: 40px;
      }
      .ui .pause-menu .text {
        font-size: 18px;
      }
      .ui .pause-menu .heading-box {
        position: absolute;
        left: 30px;
        top: 50px;
        background: rgba(255, 255, 255, 0.2);
        padding: 12px;
        border-radius: 10px;
        border: .5px solid #fff;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.24);
      }
      .ui .pause-menu .continue {
        margin-top: 20px;
      }
      .ui .pause-menu .button {
        position: relative;
        margin-top: 10px;
        background: #ddd;
        border: none;
        border-radius: 8px;
        color: #333;
        padding: 6px;
        width: 100%;
        text-align: left;
        margin-left: -6px;
      }
      .ui .pause-menu .button .value {
        float: right;
        color: #999;
      }
      .ui .pause-menu .button.selected {
        outline: 3px solid #7796ed;
      }
      .swal-overlay {
        z-index: 100000;
      }
      .swal-content.final {
        padding: 0 60px;
      }
      .swal-content.final {
        padding: 0 60px;
      }
      .line .score.score-right {
        text-align: right;
        float: right;
      }
      .line .score.score-left {
        text-align: left;
        float: left;
      }
      .line .score.score-left {
        text-align: left;
        float: left;
      }
      .line {
        display: block;
        width: 100%;
        height: 40px;
      }
      .line .type {
        width: 140px;
        display: inline-block;
      }
      .line .score-bar {
        width: 135px;
        height: 4px;
        border: .5px solid #ddd;
        right: 100px;
        position: absolute;
        margin-top: 6px;
        border-radius: 4px;
        overflow: hidden;
      }
      .line .score-bar-value {
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="start-banner"></div>
    <script src="/js/three.js"></script>
    <script src="/js/GLTFLoader.js"></script>
    <script src="/js/PointerLockControls.js"></script>
    <script src="/js/TouchControls.js"></script>
    <script src="/js/GamepadControls.js"></script>
    <script src="/js/Tween.js"></script>
    <script src="/js/physics.js"></script>
    <script src="/js/audio.js"></script>
    <script src="/js/text.js"></script>
    <script src="/js/notiflix.js"></script>
    <script src="/js/sweetalert.js"></script>
    <script src="/js/MobileUI.js"></script>
    <script src="/js/user.js"></script>
    <div class="ui">
      <div class="banner loading" style="opacity: 1"></div>
      <div class="pointer"></div>
      <div class="pointer-text">Pointer text.</div>
      <div class="infobox">
        <p class="infobox-header">Objective</p>
        <p class="infobox-timer">0:00</p>
        <br>
        <p class="infobox-description">Park in the outlined spot before the time runs out. Once you're confident, shift into park to finish. Careful not to crash!</p>
      </div>
      <div class="speed"><span id="value">0</span> MPH</div>
      <div class="settings" onclick="togglePause()" ontouchstart="togglePause()"><i class="fa fa-cog" style="pointer-events: none !important"></i></div>
      <div class="points"><span id="value">0</span> PTS</div>
      <div class="pause-menu">
        <div class="heading-box">
          <div class="header">Settings</div>
          <div class="text">Don't worry, the game is paused.</div>
          <div class="button continue" onclick="togglePause()">Resume</div>
          <div class="button" onclick="mainMenu()">Main Menu</div>
          <div class="button renderer-quality" onclick="toggleRendererQuality(this)">Renderer Quality <span class="value">1 (low)</span></div>
          <div class="button renderer-quality" onclick="toggleCarCreeping(this)">Car creeping <span class="value">off</span></div>
        </div>
      </div>
    </div>
    <script>
    let test = true;
    let mobileUI = new MobileUI();

    Notiflix.Notify.init({
      clickToClose: false,
      showOnlyTheLastOne: true,
      timeout: 2000,
      info: {
        background: "transparent",
        textColor: "#fff",
        notiflixIconColor: "#fff"
      },
      warning: {
        background: "transparent",
        textColor: "#fff",
        notiflixIconColor: "gold"
      }
    });

    function pointerText(text) {
      document.querySelector(".pointer-text").innerHTML = text;
      document.querySelector(".pointer-text").style.display = "block";
    }

    function hidePointerText() {
      document.querySelector(".pointer-text").style.display = "";
    }

    function exitControlLock() {
      controlLock = null;
      if (perspective === 0) PointerControls.isLocked = true;
      hidePointerText();
    }

    function end(score) {
      if (currentLevel === 1) {
        let center = -1.526;
        let score = Math.round(Math.min(Math.max(1000 - (Math.pow(testData[1].data.centerlinerecords.length / Math.max(testData[1].data.centerlinerecords.filter(pos => pos > center - 0.3 && pos < center + 0.3).length, 1), 3) * 36) - 36, 0), 1000));
        testData["1"].data.score = score;
      } else if (currentLevel === 2) {
        testData["2"].data.score = score;
        document.querySelector(".start-banner").style.backgroundImage = "url(/images/badge_precision.gif)";
        document.querySelector(".start-banner").style.opacity = 1;
        mobileUI.startBannerUp();
        setTimeout(() => {
          loadLevel(currentLevel + 1);
        }, 3000);
        setTimeout(() => {
          document.querySelector(".start-banner").style.opacity = 0;
          mobileUI.startBannerDown();
        }, 4000);
        return;
      } else if (currentLevel === 3) {
        stopAnimate = true;

        let veeredDecrement = testData["3"].data.veeredCount * 200;
        let stopSignsDecrement = testData["3"].data.stopSignsPassed ? 400 : 0;
        if (veeredDecrement > 200) veeredDecrement *= 2;

        let lowestDistance = Math.min(...testData["3"].data.centerlinerecords);
        let highestDistance = Math.max(...testData["3"].data.centerlinerecords);
        let precisionDecrement = 500 - Math.round((Math.max(2 - highestDistance, 0) * (500 / 4)) + (Math.max(2 + lowestDistance, 0) * (500 / 4)));

        testData[3].data.score = 1000 - Math.min(veeredDecrement + stopSignsDecrement + precisionDecrement, 1000);

        document.querySelector(".start-banner").style.backgroundImage = "url(/images/badge_awareness.gif)";
        document.querySelector(".start-banner").style.opacity = 1;
        mobileUI.startBannerUp();
        setTimeout(() => {
          loadLevel(currentLevel + 1);
        }, 3000);
        setTimeout(() => {
          document.querySelector(".start-banner").style.opacity = 0;
          mobileUI.startBannerDown();
        }, 4000);
        return;
      } else if (currentLevel === 4) {
        stopAnimate = true;

        let stopSignsDecrement = testData["4"].data.stopSignsPassed ? 500 : 0;
        let speedLimitDecrement = testData["4"].data.obeyedSpeedLimit ? 0 : 300;
        let constructionDecrement = testData["4"].data.obeyedConstruction ? 0 : 500;
        let tracksDecrement = testData["4"].data.stoppedOnTracks ? 200 : 0;

        testData[4].data.score = 1000 - Math.min(stopSignsDecrement + speedLimitDecrement + constructionDecrement + tracksDecrement, 1000);

        document.querySelector(".start-banner").style.backgroundImage = "url(/images/badge_knowledge.gif)";
        document.querySelector(".start-banner").style.opacity = 1;
        mobileUI.startBannerUp();
        setTimeout(() => {
          document.querySelector(".start-banner").style.opacity = 0;
          mobileUI.startBannerDown();
          finishTest();
        }, 5000);
        return;
      }

      loadLevel(currentLevel + 1);
    }

    function finishTest() {
      crashed = true;
      countingDown = false;
      lockPointer = false;
      exitControlLock();
      if (document.exitPointerLock) document.exitPointerLock();
      audio.end();
      stopAnimate = true;

      document.querySelector(".banner").classList.remove("loading");
      document.querySelector(".banner").style.opacity = 1;

      let lane_precision = testData[1].data.score;
      let parking_precision = testData[2].data.score;
      let awareness = testData[3].data.score;
      let road_knowledge = testData[4].data.score;
      let score = Math.round((lane_precision + parking_precision + awareness + road_knowledge) / 40);

      let content = document.createElement("div");
      content.innerHTML = `
      <div>Driving Test results</div>
      <br>
      <div class="line" id="lane_precision">
        <div class="score score-left"><span class="type">Lane precision</span> <span class="value">${lane_precision}</span></div>
        <div class="score-bar">
          <div class="score-bar-value" style="width: ${lane_precision / 10}%"></div>
        </div>
        <div class="score score-right">1000</div>
      </div>
      <div class="line" id="parking_precision">
        <div class="score score-left"><span class="type">Parking precision</span> <span class="value">${parking_precision}</span></div>
        <div class="score-bar">
          <div class="score-bar-value" style="width: ${parking_precision / 10}%"></div>
        </div>
        <div class="score score-right">1000</div>
      </div>
      <div class="line" id="awareness">
        <div class="score score-left"><span class="type">Awareness</span> <span class="value">${awareness}</span></div>
        <div class="score-bar">
          <div class="score-bar-value" style="width: ${awareness / 10}%"></div>
        </div>
        <div class="score score-right">1000</div>
      </div>
      <div class="line" id="road_knowledge">
        <div class="score score-left"><span class="type">Road Knowledge</span> <span class="value">${road_knowledge}</span></div>
        <div class="score-bar">
          <div class="score-bar-value" style="width: ${road_knowledge / 10}%"></div>
        </div>
        <div class="score score-right">1000</div>
      </div>
      <br>
      <div style="font-size: 60px">${score}%</div>
      `;
      swal({
        content: content,
        button: "Finish",
        closeOnEnterKey: false,
        closeOnEsc: false,
        closeOnClickOutside: false
      }).then(() => {
        location.replace("/");
      });
      document.querySelector(".swal-content").classList.add("final");
    }

    let currentLevel = 1;

    maxButtons = 3;

    let testData = {
      "1": {
        time: 120,
        objective: "Challenge 1: Precision. We will test your driving precision. To begin, we put you at the start of a highway. You will need to constantly steer to stay in your lane. When you see STOP, immediately slow down and stop to finish.",
        data: {
          centerlinerecords: [],
          score: 0
        }
      },
      "2": {
        time: 60,
        objective: "Challenge 2: Precision. We will test your driving precision. Park into the parking spot that the arrow is pointing at. Shift into park to finish.",
        data: {
          score: 0
        }
      },
      "3": {
        time: 90,
        objective: "Challenge 3: Awareness. We will test how aware you are during driving. We'll distract you, and your goal is to pay attention to traffic and driving while you avoid being distracted.",
        data: {
          centerlinerecords: [],
          veered: false,
          veeredCount: 0,
          stopSignsPassed: true,
          score: 0,
          controlScreen: new THREE.TextureLoader().load("/images/incoming_call.png"),
          incomingCall: false
        }
      },
      "4": {
        time: 60,
        objective: "Challenge 4: Finally, we will test your driving knowledge. Follow the instructions on the road.",
        data: {
          score: 0,
          stopSignsPassed: true,
          obeyedConstruction: false,
          obeyedSpeedLimit: true,
          stoppedOnTracks: false
        }
      },
    };
    let car = null;
    let ground = null;
    let carColliders = [];
    let spotDistances = [];
    let perspective = 0;
    let steeringLeft = false;
    let steeringRight = false;
    let engine = true;
    let throttle = false;
    let braking = false;
    let overrideEngineReset = false;
    let keyboardBraking = false;
    let intersections = null;
    let frame = 0;
    let controlLock = null;
    let manualSteering = false;
    let pixelRatio = () => (mobile ? 1.7 : 1);
    let customRendererQuality = false;
    let customPixelRatio = 1;
    let pause = false;
    let stopAnimate = false;
    let resetCarPosition = null;
    let lockPointer = true;
    let controlScreenMap = null;
    let collisionWarning = false;
    let gaveCollisionWarning = false;
    let crashed = false;
    let currentGear = "drive";
    let countingDown = true;
    let defaultFov = mobile ? 60 : 55;
    let options = { carHeadingMaxIncrement: 12, carHeadingIncrement: 0 };
    let levelEnded = false;
    let useMobileUI = true;
    let hqgraphics = false;
    let displayReverseCam = false;
    let mobileSteering = false;
    let cameraHolderPosition = 0;
    let creeping = false;
    controls = {
      "Control_Screen": true,
      "Horn": true,
      "Ignition": true,
      "Lever": true,
      "Lever_Alt": false,
      "Shifter": true
    };

    let presets = {
      time: 120,
      startTimestamp: Date.now()
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });

    camera.rotation.order = "YXZ";
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const reverseRenderTarget = new THREE.WebGLRenderTarget(300, 200);
    const reverseCamera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);

    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, { format: THREE.RGBAFormat });
    const cubeCamera = new THREE.CubeCamera(0.1, 1000, cubeRenderTarget);
    scene.add(cubeCamera);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x2b2c2d, 0.5);
    const interiorLight = new THREE.PointLight(0xffffff, 0.5);
    directionalLight.castShadow = true;
    directionalLight.shadow.camera.left = -5;
    directionalLight.shadow.camera.right = 5;
    directionalLight.shadow.camera.top = 5;
    directionalLight.shadow.camera.bottom = -5;
    directionalLight.shadow.camera.near = 1;
    directionalLight.shadow.camera.far = 100;
    directionalLight.shadow.bias = -0.001;
    directionalLight.shadow.mapSize.width = 1024;
    directionalLight.shadow.mapSize.height = 1024;
    directionalLight.shadow.camera.updateProjectionMatrix();
    directionalLight.target.position.set(0, 0, 0);
    scene.add(directionalLight);
    scene.add(directionalLight.target);
    scene.add(ambientLight);
    scene.add(hemisphereLight);
    scene.add(interiorLight);

    scene.background = new THREE.Color(0xaaaaaa);
    scene.fog = new THREE.Fog(0xaaaaaa, 0,  200);

    const PointerControls = new PointerLockControls(camera, renderer.domElement);
    const TouchControls = new THREE.TouchControls(camera, renderer.domElement);
    pointerSpeed = 2;
    touchSpeed = 3;
    PointerControls.isLocked = true;
    PointerControls.pointerSpeed = pointerSpeed;
    TouchControls.speed = touchSpeed;

    const centerVector = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    raycastTargets = [];

    document.body.appendChild(renderer.domElement);

    function gameOver(reason) {
      crashed = true;
      countingDown = false;
      lockPointer = false;
      exitControlLock();
      if (document.exitPointerLock) document.exitPointerLock();
      audio.end();
      stopAnimate = true;
      if (reason === "outofbounds" || reason === "crashed") audio.sounds.crash.play();

      setTimeout(() => {
        document.querySelector(".banner").classList.remove("loading");
        document.querySelector(".banner").style.opacity = 1;
      }, 1500);

      setTimeout(() => {
        swal({
          title: "You failed.",
          text: "You exited the driving zone.",
          buttons: ["Retry", "Return to menu"],
          closeOnEnterKey: false,
          closeOnEsc: false,
          closeOnClickOutside: false
        }).then(result => {
          if (!result) {
            resetEverything();
          } else {
            location.replace("/");
          }
        });

        if (reason === "outofbounds") {
          document.querySelector(".swal-text").textContent = "You exited the parking lot.";
        } else if (reason === "time") {
          document.querySelector(".swal-text").textContent = "You ran out of time.";
        } else if (reason === "crashed") {
          document.querySelector(".swal-text").textContent = "You crashed!";
        } else if (reason === "danger") {
          document.querySelector(".swal-text").textContent = "You parked in a danger spot.";
        }
      }, reason === "danger" ? 0 : 3000);
    }

    function togglePerspective(newPerspective = null) {
      if (newPerspective == null) newPerspective = perspective + 1;
      if (newPerspective > 2) newPerspective = 0;

      exitControlLock();
      if (newPerspective === 1) {
        perspective = 1;
        car.getObjectByName("CameraHolder_TP").add(camera);
        camera.rotation.set(0, 0, 0);
        PointerControls.isLocked = false;
        document.querySelector(".pointer").style.display = "none";
        if (engine) car.getObjectByName("Control_Screen").visible = false;
      } else if (newPerspective === 2) {
        perspective = 2;
        car.getObjectByName("CameraHolder_TP1").add(camera);
        camera.rotation.set(0, 0, 0);
        PointerControls.isLocked = false;
        document.querySelector(".pointer").style.display = "none";
        if (engine) car.getObjectByName("Control_Screen").visible = false;
      } else if (newPerspective === 0) {
        perspective = 0;
        car.getObjectByName("CameraHolder_FP").add(camera);
        PointerControls.isLocked = true;
        document.querySelector(".pointer").style.display = "";
        if (engine) car.getObjectByName("Control_Screen").visible = true;
      }

      audio.update();

      if (mobile) {
        document.querySelector(".mobile-ui .shifter-box").style.display = "";
        document.querySelector(".mobile-ui .use").style.display = "";
      }
    }

    function shift(direction) {
      if (direction === "up") {
        if (currentGear === "drive") {
          currentGear = "neutral";
          audio.click();
          Notiflix.Notify.info("Car is now in neutral.");
        } else if (currentGear === "neutral") {
          currentGear = "reverse";
          audio.click();
          physics.env.currentGear = "reverse";
          Notiflix.Notify.info("Car is now in reverse.");
        } else if (currentGear === "reverse") {
          currentGear = "park";
          audio.click();
          park();
          Notiflix.Notify.info("Car is now in park.");
        }
      } else if (direction === "down") {
        if (currentGear === "park") {
          currentGear = "reverse";
          physics.env.currentGear = "reverse";
          audio.click();
          Notiflix.Notify.info("Car is now in reverse.");
        } else if (currentGear === "reverse") {
          currentGear = "neutral";
          audio.click();
          Notiflix.Notify.info("Car is now in neutral.");
        } else if (currentGear === "neutral") {
          currentGear = "drive";
          physics.env.currentGear = "drive";
          audio.click();
          Notiflix.Notify.info("Car is now in drive.");
        }
      } else {
        currentGear = direction;
        if (currentGear === "reverse") physics.env.currentGear = "reverse";
        if (currentGear === "drive") physics.env.currentGear = "drive";
        if (currentGear === "park") {
          park();
          Notiflix.Notify.info("Car is now in park.");
        }
      }

      if (currentGear === "reverse") {
        car.getObjectByName("Control_Screen").material.map = null;

        setTimeout(() => {
          if (currentGear === "reverse") {
            displayReverseCam = true;
            car.getObjectByName("Control_Screen").material.map = reverseRenderTarget.texture;
          }
        }, 500);

        car.getObjectByName("Reverse_Lights").material.emissive = new THREE.Color(0xffffff);
        car.getObjectByName("Reverse_Lights").material.opacity = 1;
      } else {
        displayReverseCam = false;

        car.getObjectByName("Control_Screen").material.map = controlScreenMap;
        car.getObjectByName("Reverse_Lights").material.opacity = 0;
      }
    }

    function park() {
      exitControlLock();
      if (document.exitPointerLock) document.exitPointerLock();
      lockPointer = false;
      countingDown = false;

      let parkingFactor = spotDistances.map(x => spotDistances.map(d => Math.abs(x - d))).flat().reduce((a, b) => a + b) / 16;
      let score = Math.max(Math.min(Math.ceil((1 - (parkingFactor * 1.5)) * 1001), 1000), 0);

      end(score);
    }

    function driveStart() {
      if (engine && !crashed && (currentGear === "drive" || currentGear === "reverse")) audio.accelerate();
      throttle = true;
    }

    function driveStop() {
      if (engine && !crashed && (currentGear === "drive" || currentGear === "reverse")) audio.decelerate();
      throttle = false;
    }

    function brakeStart() {
      keyboardBraking = true;
      braking = true;
      car.getObjectByName("Brake_Lights").material.emissive = new THREE.Color(0xff0000);
    }

    function brakeStop() {
      braking = false;
      keyboardBraking = false;
      car.getObjectByName("Brake_Lights").material.emissive = new THREE.Color(0x000000);
    }

    function toggleEngine() {
      if (engine) {
        engine = false;
        audio.off();
        audio.sounds.warning.pause();
        car.getObjectByName("Control_Screen").visible = false;
        Notiflix.Notify.info("Engine has been shut off.");
      } else {
        engine = true;
        audio.on();
        car.getObjectByName("Control_Screen").visible = true;
        Notiflix.Notify.info("Engine has been activated.");
      }
    }

    function loadEnv(level) {
      new THREE.GLTFLoader().load(`/models/parking_lots/test${level}.glb`, function(gltf) {
        ground = gltf.scene;

        let scale = 0.33;
        let spawner = ground.getObjectByName("Spawner");
        ground.scale.set(scale, scale, scale);

        resetCarPosition = function() {
          car.position.set(spawner.position.x * scale, spawner.position.y * scale, spawner.position.z * scale);
          car.rotation.copy(ground.getObjectByName("Spawner").rotation);
          if (currentLevel === 1) {
            car.rotation.y += (Math.random() / 10) - .05;
          }
          if (currentLevel === 3) {
            car.rotation.y += (Math.random() / 10) - .05;
          }
        };
        resetCarPosition();

        ground.getObjectByName("Ground").receiveShadow = true;
        ground.getObjectByName("Ground").material.map.encoding = THREE.sRGBEncoding;
        ground.getObjectByName("Ground").material.map.minFilter = THREE.NearestFilter;
        ground.getObjectByName("Ground").material.map.magFilter = THREE.NearestFilter;
        ground.getObjectByName("Ground").material.map.needsUpdate = true;

        presets.time = testData[level.toString()].time;

        scene.add(ground);
      });
    }

    function loadLevel(level) {
      currentLevel = level;
      document.title = "Parking Master Level " + level;

      document.querySelector(".banner").classList.add("loading");
      document.querySelector(".banner").style.opacity = 1;
      document.querySelector(".points #value").textContent = localStorage["points"];
      document.querySelector(".infobox-description").textContent = testData[level.toString()].objective;

      stopAnimate = true;
      scene.remove(ground);
      loadEnv(level);

      setTimeout(() => {
        resetEverything();
      }, 2000);
    }

    function resetEverything() {
      physics.env.enginePower = 0;
      physics.env.speedMS = 0;
      physics.env.heading = 0;
      resetCarPosition();
      togglePerspective(0);
      perspective = 0;
      camera.rotation.set(0, 0, 0);
      lockPointer = true;
      shift("drive");
      audio.sounds.idle.play();
      stopAnimate = false;
      animate();
      crashed = false;
      presets.startTimestamp = Date.now();
      countingDown = true;
      document.querySelector(".banner").style.opacity = 0;
      mobileUI.reset();

      if (currentLevel === 1) {
        testData["1"].data.centerlinerecords = [];
      }
      if (currentLevel === 3) {
        testData["3"].data = {
          centerlinerecords: [],
          veered: false,
          veeredCount: 0,
          stopSignsPassed: true,
          score: 0,
          controlScreen: testData[3].data.controlScreen,
          incomingCall: false
        }
      }
      if (currentLevel === 4) {
        testData["4"].data = {
          score: 0,
          stopSignsPassed: true,
          obeyedConstruction: false,
          obeyedSpeedLimit: true,
          stoppedOnTracks: false
        }
      }
    }

    function updatePauseMenu() {
      toggleRendererQuality(document.querySelector(".ui .pause-menu .button.renderer-quality"), 0);
    }

    let pauseStartTime = null;
    function togglePause() {
      if (crashed) return;

      if (pause) {
        document.querySelector(".ui .pause-menu").style.display = "";

        setTimeout(() => {
          physics.timestamp = performance.now();

          pause = false;
          animate();

          let timePassed = Date.now() - pauseStartTime;
          presets.startTimestamp += timePassed;

          countingDown = true;
        }, 100);
      } else {
        countingDown = false;
        if (document.exitPointerLock) document.exitPointerLock();

        document.querySelector(".ui .pause-menu").style.display = "block";
        updatePauseMenu();
        pause = true;
        pauseStartTime = Date.now();
      }
    }

    function toggleRendererQuality(button, increment = 0.1) {
      if (increment != 0) {
        customRendererQuality = true;
        customPixelRatio = (customPixelRatio + increment).toFixed(1) - 0;
        if (customPixelRatio > 2) customPixelRatio = 1;
      }

      let amount = customPixelRatio < 1.3 ? "low" : customPixelRatio < 1.6 ? "medium" : "high";
      button.querySelector(".value").textContent = `${customPixelRatio} (${amount})`;
      renderer.setPixelRatio(customPixelRatio);
      renderer.render(scene, camera);
    }

    function toggleCarCreeping(button) {
      if (creeping) {
        creeping = false;
      } else {
        creeping = true;
      }

      button.querySelector(".value").textContent = creeping ? "on" : "off";
    }

    function mainMenu() {
      swal({
        text: "You will be returned to the main menu.",
        buttons: ["Cancel", "Continue"],
        closeOnEnterKey: false,
        closeOnEsc: false,
        closeOnClickOutside: false
      }).then(result => {
        if (result) {
          location.replace("/");
        }
      });
    }

    function animate() {
      if (stopAnimate || pause) return;

      frame++;

      physics.update();
      THREE.Text.update();

      if (car) {
        directionalLight.position.set(car.position.x + 10, 10, car.position.z + 5);
        directionalLight.target.position.set(car.position.x, 0, car.position.z);
        directionalLight.target.updateMatrixWorld();

        car.visible = false;
        cubeCamera.position.copy(car.position);
        cubeCamera.translateY(1);
        cubeCamera.update(renderer, scene);
        car.visible = true;

        interiorLight.position.copy(car.position);
        interiorLight.rotation.copy(car.rotation);
        interiorLight.translateY(1);
        interiorLight.translateX(0.5);

        if (engine) {
          if (throttle) {
            if (currentGear === "drive") {
              physics.env.enginePower = Math.min(physics.env.enginePower + 1500, physics.env.maxEnginePower);
            } else if (currentGear === "reverse") {
              physics.env.enginePower = Math.min(physics.env.enginePower + 1500, physics.env.maxEnginePowerReverse);
            }
          } else if (!overrideEngineReset) {
            if (creeping && (currentGear == "drive" || currentGear == "reverse") && Date.now() - presets.startTimestamp > 2000) {
              if (braking) {
                physics.env.enginePower = 0;
              } else {
                physics.env.enginePower = 1000;
              }
            } else {
              physics.env.enginePower = 0;
            }
          }
        } else {
          if (!overrideEngineReset) physics.env.enginePower = 0;
        }

        if (braking) {
          physics.env.braking = true;
          if (keyboardBraking) physics.env.brakePower = Math.min(physics.env.brakePower + 500, physics.env.maxBrakePower);
        } else {
          physics.env.braking = false;
          physics.env.brakePower = Math.max(physics.env.brakePower - 1000, 0);
        }

        if (frame % 10 === 0) {
          raycaster.setFromCamera(centerVector, camera);
          intersections = raycaster.intersectObjects(raycastTargets).filter(x => x.object.name);
          for (let i = 0; i < raycastTargets.length; i++) {
            if (typeof raycastTargets[i].getObjectByName("PointerText") !== "undefined") raycastTargets[i].getObjectByName("PointerText").visible = false;
          }

          if (intersections[0]) {
            PointerControls.pointerSpeed = pointerSpeed / 3;
            TouchControls.speed = touchSpeed / 3;
            document.querySelector(".pointer").classList.add("active");
            if (perspective == 0 && typeof intersections[0].object.getObjectByName("PointerText") !== "undefined" && !controlLock) {
              intersections[0].object.getObjectByName("PointerText").visible = true;
              TouchControls.showUseButton();
            }
          } else {
            document.querySelector(".pointer").classList.remove("active");
            PointerControls.pointerSpeed = pointerSpeed;
            TouchControls.speed = touchSpeed;
          }
        }

        if (collisionWarning) {
          if (engine && !gaveCollisionWarning) audio.warning();
          if (frame % 6 < 4) {
            car.getObjectByName("Control_Screen").material.color.g = 0.3;
            car.getObjectByName("Control_Screen").material.color.b = 0.3;
          } else {
            car.getObjectByName("Control_Screen").material.color.g = 1;
            car.getObjectByName("Control_Screen").material.color.b = 1;
          }
          gaveCollisionWarning = true;
        } else {
          gaveCollisionWarning = false;
          car.getObjectByName("Control_Screen").material.color.g = 1;
          car.getObjectByName("Control_Screen").material.color.b = 1;
        }

        if (currentGear === "drive") {
          car.getObjectByName("Shifter").rotation.x = -0.3;
        } else if (currentGear === "neutral") {
          car.getObjectByName("Shifter").rotation.x = -0.1;
        } else if (currentGear === "reverse") {
          car.getObjectByName("Shifter").rotation.x = 0.1;
        } else if (currentGear === "park") {
          car.getObjectByName("Shifter").rotation.x = 0.3;
        }

        if (ground && carColliders.length > 0) {
          const spotDistancesTemp = [];
          ground.traverse(wallPoint => {
            const wallPointPosition = wallPoint.getWorldPosition(new THREE.Vector3());

            for (let i = 0; i < carColliders.length; i++) {
              let collider = carColliders[i];
            
              if (wallPoint.name.startsWith("WallPoint")) {
                if (collider.name.startsWith("Collider")) {
                  if (collider.getWorldPosition(new THREE.Vector3()).distanceTo(wallPointPosition) < 0.4) {
                    if (wallPoint.name.includes("Obstacle")) {
                      gameOver("crashed");
                    } else {
                      gameOver("outofbounds");
                    }
                  }
                  if (collider.name === "Collider_RM") {
                    if (currentGear === "reverse" && collider.getWorldPosition(new THREE.Vector3()).distanceTo(wallPointPosition) < 2 && !collisionWarning) {
                      collisionWarning = true;
                      setTimeout(() => collisionWarning = false, 6000);
                    }
                  }
                }
              }
            }

            if (wallPoint.name.startsWith("Corner")) {
              spotDistancesTemp.push(wallPointPosition.distanceTo(car.getObjectByName("Collider_" + wallPoint.name.split("_")[1]).getWorldPosition(new THREE.Vector3())));
            }
          });

          spotDistances = spotDistancesTemp;
        }
      }
      if (!mobile || (mobile && !useMobileUI)) physics.env.heading = Math.max(Math.min(physics.env.heading + (options.carHeadingIncrement / physics.env.wheelTurnRatio), 35), -35);

      mobileUI.updateWheel(physics.env.heading);

      camera.fov = defaultFov + (physics.env.speedMS / 5) + (physics.env.acceleration / 30);
      camera.updateProjectionMatrix();
      car.getObjectByName("CameraHolder_FP").position.z = cameraHolderPosition.z + Math.min((physics.env.brakePower * physics.env.speedMS) / 10000000, 0.3);
      car.getObjectByName("CameraHolder_FP").position.x = cameraHolderPosition.x - Math.max(Math.min((physics.env.heading / 40) * (physics.env.speedMS / 70), 0.1), -0.1);
      car.getObjectByName("CameraHolder_TP").position.x = (physics.env.heading / 15) * (physics.env.speedMS / 50);

      if (frame % 5 === 0 && countingDown) {
        const timeLeft = (presets.time * 1000) - (Date.now() - presets.startTimestamp);
        const minutesLeft = timeLeft / 1000 / 60;
        const secondsLeft = ("." + minutesLeft.toString().split(".")[1]) * 60;
        const formattedTime = `${Math.floor(minutesLeft)}:${("0" + Math.floor(secondsLeft)).slice(-2)}`;
        document.querySelector(".infobox-timer").textContent = formattedTime;

        if (timeLeft < 1000) gameOver("time");
      }

      if (currentLevel === 1) {
        testData["1"].data.centerlinerecords.push(car.position.z);

        const endPosition = new THREE.Vector3(-123, 0, -1.5);
        if (car.position.distanceTo(endPosition) < 10 && physics.env.speedMPH < 0.5) end();
      } else if (currentLevel === 3) {
        testData["3"].data.centerlinerecords.push(car.position.z);

        if (car.position.z > 2.8 || car.position.z < 0.9) {
          if (!testData[3].data.veered) {
            testData[3].data.veered = true;
            testData[3].data.veeredCount++;
          }
        } else {
          testData[3].data.veered = false;
        }

        const stopPosition = new THREE.Vector3(-6, 0, 1);
        if (car.position.distanceTo(stopPosition) < 8 && physics.env.speedMPH < 0.5) testData[3].data.stopSignsPassed = false;

        const endPosition = new THREE.Vector3(85, 0, 2);
        if (car.position.distanceTo(endPosition) < 10 && physics.env.speedMPH < 0.5) end();

        if (car.position.x > -45 && !testData[3].data.incomingCall) {
          testData[3].data.incomingCall = true;
          car.getObjectByName("Control_Screen").material.map = testData[3].data.controlScreen;
          audio.sounds.ringtone.play();
        }
      } else if (currentLevel === 4) {
        if (car.position.x > -53 && car.position.x < -45 && car.position.z > -3.5 && car.position.z < 2) {
          testData[4].data.obeyedConstruction = true;
        }

        const stopPosition = new THREE.Vector3(-6, 0, 1);
        if (car.position.distanceTo(stopPosition) < 8 && physics.env.speedMPH < 0.5) testData[4].data.stopSignsPassed = false;

        const endPosition = new THREE.Vector3(85, 0, 2);
        if (car.position.distanceTo(endPosition) < 10 && physics.env.speedMPH < 0.5) end();

        if (physics.env.speedMPH > 35) testData[4].data.obeyedSpeedLimit = false;

        if (car.position.x > 20 && car.position.x < 25 && physics.env.speedMPH < 1) testData[4].data.stoppedOnTracks = true;
      }

      if (currentGear === "reverse" && displayReverseCam && frame % 4 === 0) {
        renderer.setRenderTarget(reverseRenderTarget);
        renderer.render(scene, reverseCamera);
        renderer.setRenderTarget(null);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function onWindowResize() {
      if (customRendererQuality) {
        renderer.setPixelRatio(customPixelRatio);
      } else {
        customPixelRatio = pixelRatio();
        renderer.setPixelRatio(pixelRatio());
      }

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
    }
    window.addEventListener("resize", onWindowResize);
    onWindowResize();

    physics.onUpdate = function(delta) {
      if (pause) return;
      if (car) {
        const shiftFactor = physics.env.currentGear === "drive" ? 1 : -1;
        const driveFactor= physics.env.currentGear === "drive" ? 1 : 2;
        car.translateZ(physics.env.speedMS * delta * shiftFactor);
        car.rotateY(physics.env.currentHeading * 1.5 * delta * shiftFactor * driveFactor);

        if (!mobileSteering) physics.env.heading += physics.calculateHeadingReset(physics.env.heading, physics.env.speedMS);

        car.getObjectByName("Wheel_FL").rotation.y = THREE.MathUtils.degToRad(physics.env.heading);
        car.getObjectByName("Wheel_FR").rotation.y = THREE.MathUtils.degToRad(physics.env.heading);
        car.getObjectByName("Steering_Wheel").rotation.z = -THREE.MathUtils.degToRad(physics.env.heading) * physics.env.wheelTurnRatio;

        car.getObjectByName("Wheel_FL").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_FR").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_RL").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        car.getObjectByName("Wheel_RR").rotation.x += physics.env.wheelAngularVelocity * delta * shiftFactor;
        if (frame % 5 === 0) document.querySelector(".speed #value").textContent = Math.round(physics.env.speedMPH);
      }
    };

    document.addEventListener("keydown", function(event) {
      if ((event.key === "ArrowUp" || event.key === "w") && !event.repeat) {
        if (controlLock === "Shifter") {
          shift("up");
        } else {
          driveStart();
        }
      }
      if ((event.key === "ArrowDown" || event.key === "s") && !event.repeat) {
        if (controlLock === "Shifter") {
          shift("down");
        }
      }
      if (event.key === "ArrowLeft" || event.key === "a") {
        manualSteering = true;
        new Tween(options.carHeadingIncrement, options.carHeadingMaxIncrement, 250, "in", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "ArrowRight" || event.key === "d") {
        manualSteering = true;
        new Tween(options.carHeadingIncrement, -options.carHeadingMaxIncrement, 250, "in", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "Tab" && !event.repeat) {
        event.preventDefault();
        if (controlLock) return exitControlLock(), camera.rotation.set(0, 0, 0);
        togglePerspective();
      }
      if ((event.key === "b" || event.key === " ") && !event.repeat) {
        brakeStart();
      }
      if (event.key === "p" && !event.repeat) {
        togglePause();
      }
      if (event.key === "Shift" && !event.ctrlKey && !event.altKey && !event.metaKey && !event.repeat) {
        if (!controlLock && perspective == 0 && physics.env.speedMS <= 0.2) {
          camera.lookAt(car.getObjectByName("Shifter").getWorldPosition(new THREE.Vector3()));
          intersections = [{ object: car.getObjectByName("Shifter") }];
          mousedown();
        }
      }
    });

    document.addEventListener("keyup", function(event) {
      if (event.key === "ArrowUp" || event.key === "w") {
        driveStop();
      }
      if (event.key === "ArrowLeft" || event.key === "a") {
        manualSteering = false;
        new Tween(options.carHeadingIncrement, 0, 500, "out", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "ArrowRight" || event.key === "d") {
        manualSteering = false;
        new Tween(options.carHeadingIncrement, 0, 500, "out", (x) => { options.carHeadingIncrement = x }).start();
      }
      if (event.key === "b" || event.key === " ") {
        brakeStop();
      }
    });

    function mousedown(event) {
      if (!mobile && document.pointerLockElement == null && lockPointer && (event ? event.target.className != "settings" : true) && !pause) {
        document.body.requestPointerLock();
        if (perspective === 0) PointerControls.lock();
      }

      if (perspective == 0 && intersections && intersections[0]) {
        const control = intersections.map(x => x.object.name);
        if (!controlLock) {
          audio.click();
          if (control.includes("Shifter")) {
            if (!mobile || (mobile && !useMobileUI)) {
              if (physics.env.speedMS > 0.2) return Notiflix.Notify.warning("The car must be fully stopped in order to shift gears.");
              if (!engine) return Notiflix.Notify.warning("Engine must be activated in order to shift gears.");
              pointerText("You are now shifting gears (<span class='key'>&UpArrow;</span> <span class='key'>&DownArrow;</span> to shift, <span class='key'>Tab</span> to exit)");
              controlLock = "Shifter";
              PointerControls.isLocked = false;
            }
          } else if (control.includes("Ignition")) {
            if (physics.env.speedMS > 0.2) return Notiflix.Notify.warning("The car must be fully stopped to shut off the engine.");
            toggleEngine();
          } else if (control.includes("Horn")) {
            audio.sounds.horn.play();
          }
        }
      }
    }

    function mouseup(event) {
      if (PointerControls.isLocked && lockPointer) {
        if (perspective === 0) PointerControls.lock();
      }
      setTimeout(() => {
        audio.sounds.horn.pause();
        audio.sounds.horn.currentTime = 0;
      }, 200);
    }

    document.addEventListener("mousedown", mousedown);
    document.addEventListener("mouseup", mouseup);

    function touchShift(element) {
      if (physics.env.speedMS > 0.2) return Notiflix.Notify.warning("The car must be fully stopped in order to shift gears.");
      if (!engine) return Notiflix.Notify.warning("Engine must be activated in order to shift gears.");
      audio.click();
      shift(element.dataset.gear);
      document.querySelector(".shifter-box-option.selected").classList.remove("selected");
      element.classList.add("selected");
    }

    function loadVehicle() {
      new THREE.GLTFLoader().load(`/models/cars/${selectedCar}.glb`, function(gltf) {
        car = gltf.scene;

        const enginePhysicsKeys = ["finalDrive", "wheelRadius", "maxRPM", "maxRPMReverse"];
        Object.keys(car.children[0].userData).forEach((key, index) => {
          if (enginePhysicsKeys.includes(key)) {
            physics.env.engine[key] = Object.values(car.children[0].userData)[index];
          } else {
            physics.env[key] = Object.values(car.children[0].userData)[index];
          }
        });

        car.traverse(child => {
          if (child.isMesh) {
            if (child.material) child.material.vertexColors = false;

            if (child.geometry) {
              child.geometry.computeBoundingSphere();
              if (child.material.map) {
                child.material.map.needsUpdate = true;
              }
              child.material.needsUpdate = true; 
            }
          }
        });

        car.getObjectByName("CameraHolder_FP").add(camera);
        car.getObjectByName("Wheel_FL").rotation.order = "YXZ";
        car.getObjectByName("Wheel_FR").rotation.order = "YXZ";
        car.getObjectByName("Wheel_RL").rotation.order = "YXZ";
        car.getObjectByName("Wheel_RR").rotation.order = "YXZ";

        new THREE.TextureLoader().load("/images/sky.png", function(texture) {
          let pmremGenerator = new THREE.PMREMGenerator(renderer);
          let envMap = pmremGenerator.fromEquirectangular(texture).texture;
          car.getObjectByName("Exterior_Shell").material.envMap = envMap;
        });

        loadEnv(currentLevel);

        controlScreenMap = new THREE.TextureLoader().load("/images/control_screen.png");
        car.getObjectByName("Mirrors").material.envMap = cubeRenderTarget.texture;
        car.getObjectByName("Control_Screen").material = new THREE.MeshBasicMaterial({ map: controlScreenMap });
        car.getObjectByName("CameraHolder_Reverse").add(reverseCamera);

        raycastTargets = [car.getObjectByName("Horn"), car.getObjectByName("Ignition"), car.getObjectByName("Lever"), car.getObjectByName("Lever_Alt"), car.getObjectByName("Shifter"), car.getObjectByName("Control_Screen")];
        raycastTargets.forEach((control, index) => {
          if (!controls[control.name]) return raycastTargets.splice(index, 1);
        });
        raycastTargets.forEach((control, index) => {
          if (control.name === "Control_Screen") {
            return;
          }

          let nameMap = {
            "Horn": "Car horn",
            "Ignition": "Car ignition",
            "Lever": "Control stick",
            "Lever_Alt": "Control stick",
            "Shifter": "Shifter"
          };
          const pointer = THREE.Text.createPointerText(nameMap[control.name], 30, "Arial");
          control.add(pointer);
        });

        carColliders = [car.getObjectByName("Collider_FL"), car.getObjectByName("Collider_FM"), car.getObjectByName("Collider_FR"), car.getObjectByName("Collider_RL"), car.getObjectByName("Collider_RM"), car.getObjectByName("Collider_RR")];
        cameraHolderPosition = car.getObjectByName("CameraHolder_FP").position.clone();

        scene.add(car);

        renderer.setRenderTarget(reverseRenderTarget);
        renderer.render(scene, reverseCamera);
        renderer.setRenderTarget(null);

        animate();
        audio.start();

        document.querySelector(".infobox-description").textContent = testData["1"].objective;

        setTimeout(() => {
          document.querySelector(".points #value").textContent = localStorage["points"];

          presets.startTimestamp = Date.now();
          document.querySelector(".banner").style.opacity = 0;
        }, 2000);
      });
    }

    started = false;
    document.addEventListener("click", function() {
      if (!started) {
        started = true;
        document.querySelector(".start-banner").style.opacity = 0;
        mobileUI.startBannerDown();
        start();
      }
    });
    </script>
    <script src="/js/CarSelector.js"></script>
  </body>
</html>
